---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app_name-httproute
  labels:
    app: app_name
  namespace: NSENVIRONMENT
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: ingress
  # hostnames:
  # - "whoami.docker.localhost"
  # - "172.31.144.74"

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /app_name

      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /

      backendRefs:
        - name: app_name-service
          port: PORTINGO


---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: app_name-hpa
  namespace: NSENVIRONMENT
  labels:
    app: app_name
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: app_name-deployment

  minReplicas: 2
  maxReplicas: 10

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60

    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
