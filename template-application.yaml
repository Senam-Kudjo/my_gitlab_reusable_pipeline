#### THIS IS THE TEMPLATE FILE MY SCRIPT USES TO CREATE NEW ARGOCD APPLICATIONS FOR NEW DEPLOYMENTS ####

#### SHOULD BE PLACED AT THE ROOT DIRECTORY OF THE ARGOCD-K8S REPO #### eg. ./template-application.yaml ... not within the ENVIRONMENT or environment folder/directory

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app_name
  namespace: argocd
spec:
  destination:
    namespace: ENVIRONMENT
    server: 'https://kubernetes.default.svc'
  source:
    path: ${ENVIRONMENT}/manifest/${SERVICE_NAME}
    repoURL: 'https://gitlab.com/Senam_Kudjo_Forever/auto-filler.git'
    targetRevision: HEAD
  project: ENVIRONMENT
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
